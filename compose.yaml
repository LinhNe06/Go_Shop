services:
  postgres:
    image: postgres:16
    container_name: pg-goshop
    environment:
      POSTGRES_USER: goshop
      POSTGRES_PASSWORD: goshop123
      POSTGRES_DB: goshop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  postgres-data:
